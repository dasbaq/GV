data:
  max_lc_len: 1024
  sigma_curve_size: 512
  image_size: 128
  approx_levels: [1, 2]
  modes: [1, 2, 3]
  mode_sampling_weights: [1.0, 1.0, 1.0]
  split:
    train: 0.8
    val:   0.1
    test:  0.1
  param_normalization:
    H0_approx:     {min: 45.0, max: 90.0}
    z_lens:        {min: 0.1,  max: 1.0}
    z_source:      {min: 0.5,  max: 3.5}
    sigma_v:       {min: 100,  max: 500}
    q:             {min: 0.5,  max: 1.0}
    theta_E:       {min: 0.5,  max: 2.0}
    dt_lc:         {min: 0.0,  max: 250.0}
    dt_lc_sigma:   {min: 0.0,  max: 12.0}

model:
  d_model: 128
  n_heads: 4
  cnn_backbone: cnn_small
  image_backbone: unet_small
  dropout: 0.1
  mode2_max_dm_dim: 4

training:
  batch_size: 32
  lr: 3.0e-4
  weight_decay: 1.0e-4
  epochs: 100
  warmup_epochs: 5
  early_stop_patience: 10
  loss_weights:
    mode1: 1.0
    mode2: 1.0
    mode3: 0.5
    physics: 0.1
    calibration: 0.1
    ssim: 0.1
  amp: true

seed: 1337

catalog:
  phase4_v0_3:
    h0_stratified_range: [60.0, 80.0]
    h0_stratified_bins: 10
