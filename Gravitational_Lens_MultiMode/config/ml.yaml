data:
  max_lc_len: 1024
  sigma_curve_size: 512
  approx_levels: [1, 2]
  modes: [1, 2]
  mode_sampling_weights: [1.0, 1.0]
  split:
    train: 0.8
    val:   0.1
    test:  0.1
  param_normalization:
    H0_approx:     {min: 45.0, max: 90.0}
    z_lens:        {min: 0.1,  max: 1.0}
    z_source:      {min: 0.5,  max: 3.5}
    sigma_v:       {min: 100,  max: 500}
    q:             {min: 0.5,  max: 1.0}
    theta_E:       {min: 0.5,  max: 2.0}
    dt_lc:         {min: 0.0,  max: 250.0}
    dt_lc_sigma:   {min: 0.0,  max: 20.0}
    n_epochs_quality:          {min: 0.0, max: 1500.0, transform: log}
    baseline_days:             {min: 0.0, max: 5000.0, transform: log}
    median_cadence_days:       {min: 0.0, max: 50.0, transform: log}
    median_photometric_error:  {min: 0.0, max: 0.5, transform: log}
    missing_sigma_v:           {min: 0.0, max: 1.0}
    missing_theta_E:           {min: 0.0, max: 1.0}
    missing_q:                 {min: 0.0, max: 1.0}
  observed_features:
    missing_lens_value_policy: normalized_zero
    real_yaml_zero_missing_modalities: true
    primary_pair_convention: brightest_pair_positive_delay
    required_real_delay_fields: [dt_lc, dt_lc_sigma]
    dt_sign_convention:
      storage: absolute_positive
      negative_input_action: abs_and_flip_pair_order
      preserve_pair_order_metadata: true
    dt_lc_sigma_sampler:
      mode: relative_then_clip
      relative_error:
        distribution: log_uniform
        min: 0.01
        max: 0.30
      absolute_floor_days: 0.3
      absolute_ceiling_days: 20.0

model:
  d_model: 128
  n_heads: 4
  cnn_backbone: cnn_small
  dropout: 0.1
  mode2_max_dm_dim: 4

training:
  batch_size: 32
  lr: 3.0e-4
  weight_decay: 1.0e-4
  epochs: 100
  warmup_epochs: 5
  early_stop_patience: 10
  loss_weights:
    mode1: 1.0
    mode2: 1.0
    physics: 0.1
    calibration: 0.1
  amp: true

seed: 1337

catalog:
  phase4_v0_3:
    h0_stratified_range: [60.0, 80.0]
    h0_stratified_bins: 10
